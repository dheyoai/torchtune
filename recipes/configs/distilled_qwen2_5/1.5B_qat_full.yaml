# Config for multi-device full finetuning in full_finetune_distributed.py
# using a Qwen2.5 1.5B model
#
# This config assumes that you've run the following command before launching:
#   tune download deepseek-ai/DeepSeek-R1-Distill-Qwen-1.5B --output-dir /shareddata/dheyo/varunika/QAT/torchtune/models/DeepSeek-R1-Distill-Qwen-1.5B
#
# To launch on 2 devices, run the following command from root:
#   tune run --nproc_per_node 2 full_finetune_distributed --config distilled_qwen2_5/1.5B_full
#   tune run --nproc_per_node 2 qat_distributed --config recipes/configs/distilled_qwen2_5/1.5B_qat_full.yaml ### for distributed QAT 
# You can add specific overrides through the command line. For example
# to override the checkpointer directory while launching training:
#   tune run --nproc_per_node 2 full_finetune_distributed --config qwen2_5/1.5B_full checkpointer.checkpoint_dir=<YOUR_CHECKPOINT_DIR>
#
# This config is for fine-tuning on 2+ GPUs.

## tune run quantize --config recipes/configs/qwen2_5/1.5B_qat_full.yaml

output_dir: /shareddata/dheyo/varunika/QAT/torchtune/models/torchtune/distilled_qwen2_5_1_5B/qat_full_v9 # /shareddata/dheyo/varunika/QAT/torchtune/models may be deleted by your system. Change it to your preference.

# Model arguments
model:
  _component_: torchtune.models.distilled_qwen2_5.distilled_qwen2_5_1_5b_instruct

# Tokenizer
tokenizer:
  _component_: torchtune.models.distilled_qwen2_5.distilled_qwen2_5_tokenizer
  path: /shareddata/dheyo/varunika/QAT/torchtune/models/DeepSeek-R1-Distill-Qwen-1.5B/vocab.json
  merges_file: /shareddata/dheyo/varunika/QAT/torchtune/models/DeepSeek-R1-Distill-Qwen-1.5B/merges.txt
  max_seq_len: 2048

# Checkpointer
checkpointer:
  _component_: torchtune.training.FullModelHFCheckpointer
  checkpoint_dir: /shareddata/dheyo/varunika/QAT/torchtune/models/DeepSeek-R1-Distill-Qwen-1.5B
  checkpoint_files: [model.safetensors]
  recipe_checkpoint: null
  output_dir: ${output_dir}
  model_type: QWEN2
resume_from_checkpoint: False

# Dataset and Sampler
dataset:
  _component_: torchtune.datasets.gsm8k_dataset
  packed: False  # True increases speed
  split: train[:95%]
seed: null
shuffle: True

# Validation
run_val_every_n_steps: 100 # Change to an integer to enable validation every N steps
dataset_val:
  _component_: torchtune.datasets.gsm8k_dataset
  split: train[95%:]
batch_size_val: ${batch_size}

# Fine-tuning arguments
epochs: 10
max_steps_per_epoch: null
batch_size: 8
# QAT arguments
quantizer:
  _component_: torchtune.training.quantization.Int8DynActIntVarWeightQATQuantizer
  groupsize: 256
  
fake_quant_after_n_steps: 1000

per_layer_quant_config_json: /shareddata/dheyo/varunika/QAT/torchtune/quant_config_example.json

gradient_accumulation_steps: 1  # Use to increase effective batch size
optimizer:
  _component_: torch.optim.AdamW
  fused: True
  lr: 5e-6

# lr_scheduler:
#   _component_: torchtune.training.lr_schedulers.get_cosine_schedule_with_warmup
#   num_warmup_steps: 100

  
optimizer_in_bwd: False  # True saves memory. Requires gradient_accumulation_steps=1
loss:
  _component_: torchtune.modules.loss.LinearCrossEntropyLoss

# Training env
device: cuda

# Memory management / performance
enable_activation_checkpointing: False  # True reduces memory
enable_activation_offloading: False  # True reduces memory
dtype: bf16
clip_grad_norm: null
compile: False  # torch.compile the model + loss, True increases speed + decreases memory

# Logging
# metric_logger:
#   _component_: torchtune.training.metric_logging.DiskLogger
#   log_dir: ${output_dir}/logs
# log_every_n_steps: 1
# log_peak_memory_stats: True
# log_level: INFO  # DEBUG, WARN, etc.

metric_logger:
  _component_: torchtune.training.metric_logging.TensorBoardLogger
  log_dir: ${output_dir}/logs
log_every_n_steps: 1
log_peak_memory_stats: True
log_level: INFO  # DEBUG, WARN, etc.


# Profiler (disabled)
profiler:
  _component_: torchtune.training.setup_torch_profiler
  enabled: False

  #Output directory of trace artifacts
  output_dir: ${output_dir}/profiling_outputs

  #`torch.profiler.ProfilerActivity` types to trace
  cpu: True
  cuda: True

  #trace options passed to `torch.profiler.profile`
  profile_memory: False
  with_stack: False
  record_shapes: True
  with_flops: False

  # `torch.profiler.schedule` options:
  # wait_steps -> wait, warmup_steps -> warmup, active_steps -> active, num_cycles -> repeat
  wait_steps: 5
  warmup_steps: 3
  active_steps: 2
  num_cycles: 1
